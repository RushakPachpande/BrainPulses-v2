# BrainPulses API — HTTPS + HTTP/2 + HTTP/3
#
# Domain: https://server.brainpulses.com
# Upstream: PM2 API at http://127.0.0.1:3002
#
# Pattern aligned with LevelUP/DISHA http2 configs, plus QUIC (HTTP/3).
#
# Install (after Let's Encrypt certs exist — see docs/ops/DEPLOY.md):
#   sudo cp docs/ops/nginx/server.brainpulses.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Open UDP/443 for HTTP/3 (QUIC), e.g. ufw allow 443/udp
#
# Verify:
#   curl -I --http2 https://server.brainpulses.com/health
#   curl -I --http3 https://server.brainpulses.com/health


############################################
# HTTP -> HTTPS Redirect
############################################
server {
    listen 80;
    listen [::]:80;
    server_name server.brainpulses.com;
    return 301 https://$host$request_uri;
}


############################################
# HTTPS API Proxy (HTTP/2 + HTTP/3)
############################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/3 (QUIC). Do not put reuseport on every vhost — one address shared by all sites.
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name server.brainpulses.com;

    # Certbot / Let's Encrypt (paths after certbot for this host)
    ssl_certificate /etc/letsencrypt/live/server.brainpulses.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.brainpulses.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Advertise HTTP/3 to clients
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;

    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
