# BrainPulses Admin SPA — HTTPS + HTTP/2 + HTTP/3
#
# Domain: https://admin.brainpulses.com
# Static root: /var/www/brainpulses/admin
#
# Pattern aligned with LevelUP levelup.http2.conf.example, plus QUIC (HTTP/3).
#
# Install (after Let's Encrypt certs exist — see docs/ops/DEPLOY.md):
#   sudo cp docs/ops/nginx/admin.brainpulses.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Open UDP/443 for HTTP/3 (QUIC), e.g. ufw allow 443/udp
#
# Verify:
#   curl -I --http2 https://admin.brainpulses.com
#   curl -I --http3 https://admin.brainpulses.com


############################################
# HTTP -> HTTPS Redirect
############################################
server {
    listen 80;
    listen [::]:80;
    server_name admin.brainpulses.com;
    return 301 https://$host$request_uri;
}


############################################
# HTTPS Admin SPA (HTTP/2 + HTTP/3)
############################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name admin.brainpulses.com;

    ssl_certificate /etc/letsencrypt/live/admin.brainpulses.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.brainpulses.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/brainpulses/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
}
